<!-- ============ pannello dimostrativo dei contatti ============ -->
<dialog class="pannello" id="pannello" aria-labelledby="pannello-titolo">
  <form method="dialog" class="pannello__chiudi-forma">
    <button class="pannello__chiudi" aria-label="Chiudi"><span aria-hidden="true">✕</span></button>
  </form>
  <p class="pannello__etichetta">Progetto dimostrativo</p>
  <h2 class="pannello__titolo" id="pannello-titolo">Il tuo glow-up è pronto.</h2>
  <p class="pannello__testo">
    In un sito reale questo pulsante aprirebbe WhatsApp con la richiesta
    già scritta. Qui non c'è un numero perché PEACH CLUB è un'attività
    dimostrativa, ma puoi provare tutta l'esperienza:
  </p>

  <p class="pannello__messaggio" data-messaggio hidden></p>
  <div class="pannello__coda">
    <p class="pannello__invito">Vuoi un sito così per la tua attività?</p>
    <a class="bottone bottone--corallo" href="../">
      Vai a Sito in Vista
    </a>
  </div>
</dialog>
